# XGB 模型 - 特征工程优化（目标 60%+）
seed: 42
data_dir: ./features
emotions: [happy, sad, normal]

use_npy_data: true
modalities: [filtered, powerspec, att, med]

split:
  test_size: 0.20
  val_size: 0.10
  random_state: 42

preprocess:
  impute_strategy: mean
  scale: true
  select_k_best: 100  # ✅ 增加特征数量
  pca_n_components: null
  augment: false
  noise_std: 0.01
  time_jitter: 0.02

model:
  type: xgboost
  cv: 3
  n_jobs: -1
  random_state: 42
  param_grid:
    # ✅ 简化参数网格，专注于关键参数
    n_estimators: [500, 800, 1000]
    learning_rate: [0.05, 0.1]
    max_depth: [5, 7, 9]
    min_child_weight: [1, 3]
    subsample: [0.8, 0.9, 1.0]
    colsample_bytree: [0.8, 0.9, 1.0]
    reg_lambda: [0.5, 1.0]
    reg_alpha: [0.0, 0.5]
    gamma: [0, 0.1]

output:
  base_dir: outputs
  run_name: XGB

viz:
  seaborn_confusion_matrix: true
  umap_boundary: true